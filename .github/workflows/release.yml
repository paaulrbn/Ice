name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Zip app
        run: |
          cd build/Build/Products/Release
          zip -r Ice.zip Ice.app

      - name: Create release
        run: gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        run: gh release upload ${{ github.ref_name }} build/Build/Products/Release/Ice.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}